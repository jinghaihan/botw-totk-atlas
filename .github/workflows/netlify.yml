name: Netlify

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "Missing Netlify build hook secret."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --data '{}' \
            --output /dev/null \
            "$NETLIFY_BUILD_HOOK"
